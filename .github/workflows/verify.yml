name: Verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check public repository boundary
        if: github.repository == 'suzuuuuu09/suzuuuuu09.com'
        run: node scripts/verify-public-boundary.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build:check
      - name: Verify generated Worker routes
        run: |
          pnpm exec wrangler dev --config dist/server/wrangler.json --port 8787 > "$RUNNER_TEMP/worker-preview.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid"' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --max-time 5 --fail --silent --output /dev/null http://localhost:8787/
          pnpm run check:worker
